# Support: https://discord.gg/ktxCyUd7Ny
# Github: https://github.com/ryderbelserion
#
# Issues: https://github.com/ryderbelserion/ChatterBox/issues
# Features: https://github.com/ryderbelserion/ChatterBox/issues
root:
  # The prefix that appears in front of commands!
  prefix: " <gold>ChatterBox <reset>"
  # The name of the server.
  server-name: "global"
  # Configuration options related to the plugin database!
  database: # The type of database which we store data in!
    # Available Types:
    #  ⤷ POSTGRES
    #  ⤷ SQLITE (DEFAULT)
    type: "SQLITE"
    # Connection options
    connection:
      # The name of the database, You must create this first manually.
      database: ""
      # Available Ports:
      #  ⤷ POSTGRES (5432)
      #  ⤷ SQLITE (N/A)
      port: 5432

      # Database Credentials
      username: ""
      password: ""

      # Define the address and port for the database.
      # - The standard DB engine port is used by default
      #   (MySQL: 3306, PostgreSQL: 5432, MongoDB: 27017)
      # - Specify as "host:port" if differs
      address: ""

    # These settings apply to the MySQL connection pool.
    # - The default values will be suitable for the majority of users.
    # - Do not change these settings unless you know what you're doing!
    pool-settings:
      # Sets the maximum size of the MySQL connection pool.
      # - Basically this value will determine the maximum number of actual
      #   connections to the database backend.
      # - More information about determining the size of connection pools can be found here:
      #   https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
      maximum-pool-size: 10

      # Sets the minimum number of idle connections that the pool will try to maintain.
      # - For maximum performance and responsiveness to spike demands, it is recommended to not set
      #   this value and instead allow the pool to act as a fixed size connection pool.
      #   (set this value to the same as 'maximum-pool-size')
      minimum-idle: 10

      # This setting controls the maximum lifetime of a connection in the pool in milliseconds.
      # - The value should be at least 30 seconds less than any database or infrastructure imposed
      #   connection time limit.
      maximum-lifetime: 900000 # 5 minutes

      # This setting controls the maximum number of milliseconds that the plugin will wait for a
      # connection from the pool, before timing out.
      connection-timeout: 5000 # 5 seconds

      # This setting controls how frequently the pool will 'ping' a connection in order to prevent it
      # from being timed out by the database or network infrastructure, measured in milliseconds.
      # - The value should be less than maximum-lifetime and greater than 30000 (30 seconds).
      # - Setting the value to zero will disable the keepalive functionality.
      heartbeat: 0

      # This setting allows you to define extra properties for connections.
      #
      # By default, the following options are set to enable utf8 encoding. (you may need to remove
      # these if you are using PostgreSQL)
      #   useUnicode: true
      #   characterEncoding: utf8
      #
      # You can also use this section to disable SSL connections, by uncommenting the 'useSSL' and
      # 'verifyServerCertificate' options below.
      properties:
        useUnicode: true
        characterEncoding: utf8
        #useSSL: false
        #verifyServerCertificate: false
  # Settings related to the motd.
  motd:
    # Should the message of the day be sent?
    # You can configure the output of these in messages.yml, or the locale folder.
    toggle: false
    # The time to wait in seconds before sending the message of the day.
    delay: 0
  # All options related to join/quit events.
  traffic:
    # All settings related to the join message.
    join-message:
      # Should we override the join message?
      toggle: true
      # Title Settings
      title:
        # Should it be a fancy title?
        toggle: false
        # The top text
        header: "Player has joined!"
        # The bottom text
        footer: "{player}"
        # Handles the delays
        delay:
          # How long should it show for?
          duration: 5
          # Handles the fade out
          fade:
            # How long should it take to fade out?
            out: 1
            # How long should it take to fade in?
            in: 1
      # Available Placeholders: {player}, {prefix}, {suffix}
      # If use-titles is true, this is the header.
      output: "<dark_gray>[<green>+</green>]</dark_gray> {player}"
      # Per group formats (requires LuckPerms as we check the group name)
      groups:
        # The name of the group must match the "group" in LuckPerms
        owner:
          # Title Settings
          title:
            # The top text
            header: "The owner has joined!"
            # The bottom text
            footer: "{player}"
            # Handles the delays
            delay:
              # How long should it show for?
              duration: 5
              # Handles the fade out
              fade:
                # How long should it take to fade out?
                out: 1
                # How long should it take to fade in?
                in: 1
          # Available Placeholders: {player}, {prefix}, {suffix}
          # If use-titles is true, this is the header.
          output: "<dark_gray>[<yellow>+</yellow>]</dark_gray> {player}"
          # If use-titles is true, this is the footer.
          footer: "{player}"
    # All settings related to the quit message
    quit-message:
      # Should we override the quit message?
      toggle: true
      # Title Settings
      title:
        # Should it be a fancy title?
        toggle: false
        # The top text
        header: "Player has quit!"
        # The bottom text
        footer: "{player}"
        # Handles the delays
        delay:
          # How long should it show for?
          duration: 5
          # Handles the fade out
          fade:
            # How long should it take to fade out?
            out: 1
            # How long should it take to fade in?
            in: 1
      # Available Placeholders: {player}, {prefix}, {suffix}
      output: "<dark_gray>[<red>-</red>]</dark_gray> {player}"
      # Per group formats (requires LuckPerms as we check the group name)
      groups:
        # The name of the group must match the "group" in LuckPerms
        owner:
          # Title Settings
          title:
            # The top text
            header: "The owner has left!"
            # The bottom text
            footer: "{player}"
            # Handles the delays
            delay:
              # How long should it show for?
              duration: 5
              # Handles the fade out
              fade:
                # How long should it take to fade out?
                out: 1
                # How long should it take to fade in?
                in: 1
          # Available Placeholders: {player}, {prefix}, {suffix}
          # If use-titles is true, this is the header.
          output: "<dark_gray>[<yellow>-</yellow>]</dark_gray> {player}"
          # If use-titles is true, this is the footer.
          footer: "{player}"